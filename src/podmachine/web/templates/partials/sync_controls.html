{# Caption + button. Swapped on every sync poll (out-of-band, see sync_update.html). #}
{% set polled = channels | map(attribute='last_polled_at') | select | list %}
<div id="sync-controls" class="sync-controls" {% if oob %}hx-swap-oob="true"{% endif %}>
  {% if not sync.running and polled %}
  <span class="sync-caption">Last synced <time datetime="{{ polled | max }}">{{ polled | max }}</time></span>
  {% endif %}
  <button id="sync-button" type="button" class="btn btn-sync" hx-post="/admin/actions/sync"
          hx-target="#sync-strip" hx-swap="outerHTML" hx-disabled-elt="this" {% if sync.running %}disabled{% endif %}>
    {% if sync.running %}
    <span class="spinner" aria-hidden="true"></span> Syncing…
    {% else %}
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 0-15.5-6.2L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 15.5 6.2L21 16"/><path d="M16 16h5v5"/></svg>
    Sync now
    {% endif %}
  </button>
</div>
