<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}podmachine admin{% endblock %}</title>
  <link rel="stylesheet" href="/static/admin.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <header>
    <a href="/admin/" class="brand"><span class="brand-accent">pod</span>machine</a>
    <nav class="nav">
      <a href="/admin/" {% if request.url.path == '/admin/' %}class="active"{% endif %}>Channels</a>
      <a href="/admin/settings" {% if request.url.path == '/admin/settings' %}class="active"{% endif %}>Settings</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    // Server renders UTC ISO timestamps (no client timezone data at render
    // time); localize them here instead, and re-run after every htmx swap
    // since polling/action responses bring in fresh <time> elements.
    function localizeDates() {
      document.querySelectorAll("time[datetime]").forEach(function (el) {
        var d = new Date(el.getAttribute("datetime"));
        if (!isNaN(d)) {
          el.textContent = d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
        }
      });
    }
    document.addEventListener("DOMContentLoaded", localizeDates);
    document.body.addEventListener("htmx:afterSettle", localizeDates);

    // Per-channel retention form: only the "count" strategy needs the
    // number input, and picking "use global default" or "none" can just
    // say in words what that means instead — no server round-trip needed
    // for this, it's a pure client-side description of the selected option.
    function initRetentionForms() {
      document.querySelectorAll(".retention-form[data-global-strategy]").forEach(function (form) {
        var select = form.querySelector('select[name="strategy"]');
        var keepLatestField = form.querySelector(".keep-latest-field");
        var description = form.querySelector(".retention-description");
        if (!select) return;

        var globalStrategy = form.dataset.globalStrategy;
        var globalKeepLatest = form.dataset.globalKeepLatest;

        function update() {
          var value = select.value;
          if (keepLatestField) keepLatestField.classList.toggle("is-hidden", value !== "count");
          if (!description) return;
          if (value === "count") {
            description.textContent = "";
          } else if (value === "none") {
            description.textContent = "Keeps all episodes.";
          } else if (globalStrategy === "count") {
            description.textContent = "Keeps the " + globalKeepLatest + " latest episodes.";
          } else {
            description.textContent = "Keeps all episodes.";
          }
        }

        select.addEventListener("change", update);
        update();
      });
    }
    document.addEventListener("DOMContentLoaded", initRetentionForms);
    document.body.addEventListener("htmx:afterSettle", initRetentionForms);
  </script>
</body>
</html>
